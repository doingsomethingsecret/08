- name: Install Docker
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: yes
  become: true

- name: Add vagrant user to docker group
  ansible.builtin.user:
    name: vagrant
    groups: docker
    append: yes
  become: true

- name: Verify Docker installation
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false