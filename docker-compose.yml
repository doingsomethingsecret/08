version: "3.8"

services:
  db:
    image: postgres:15
    container_name: assignment08-db
    restart: always
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: flask-app
    container_name: assignment08-app
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy  
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppassword
    ports:
      - "5000:5000"

volumes:
  db_data:
  